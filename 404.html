<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protosign – Quick MVP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect,useRef}=React;
const currency=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:'Zambian Kwacha'}).format(n);
const uid=()=>('PS-'+Math.random().toString(36).slice(2,8)).toUpperCase();

const SERVICES=[{id:'branding',name:'3D Branding',factor:1.0},{id:'signage',name:'Signage & Displays',factor:1.1},{id:'furniture',name:'Furniture & Fixtures',factor:1.25}];
const MATERIALS=[{id:'acrylic',name:'Acrylic',factor:1.0},{id:'wood',name:'Wood (MDF)',factor:0.9},{id:'metal',name:'Metal',factor:1.4}];
const FINISHES=[{id:'matte',name:'Matte',factor:1.0},{id:'gloss',name:'Gloss',factor:1.1},{id:'powder',name:'Powder Coat',factor:1.25}];
const SIZES=[{id:'s',name:'Small ≤40cm',base:80},{id:'m',name:'Medium ≤80cm',base:180},{id:'l',name:'Large ≤150cm',base:420}];
const ADDONS=[{id:'install',name:'Installation',price:60},{id:'delivery',name:'Delivery',price:20},{id:'maintenance',name:'Maintenance (3 mo)',price:45}];
const FLOW=['Received','In Production','Quality Check','Ready','Delivered'];

function calc(sel){
  const size=SIZES.find(x=>x.id===sel.sizeId)||SIZES[0];
  const material=MATERIALS.find(x=>x.id===sel.materialId)||MATERIALS[0];
  const finish=FINISHES.find(x=>x.id===sel.finishId)||FINISHES[0];
  const service=SERVICES.find(x=>x.id===sel.serviceId)||SERVICES[0];
  let per=size.base*material.factor*finish.factor*service.factor;
  const q=+sel.qty||1, disc=q>=100?.2:q>=50?.12:q>=20?.08:q>=10?.05:0; per*=1-disc;
  const addons=sel.addons.reduce((s,id)=>s+(ADDONS.find(a=>a.id===id)?.price||0),0);
  const subtotal=per*q+addons, tax=subtotal*.16, total=subtotal+tax;
  return {per,addons,subtotal,tax,total,disc};
}

function Upload({value,onChange}){
  const ref=useRef(null);
  return <div className="flex gap-3 items-start">
    <div className="border rounded-xl w-56 h-36 flex items-center justify-center bg-white">{value?<img src={value} className="max-w-full max-h-32"/>:<span className="text-gray-500 text-sm">Upload logo/mock</span>}</div>
    <div className="flex flex-col gap-2">
      <input ref={ref} type="file" accept="image/*" className="hidden" onChange={e=>{const f=e.target.files?.[0];if(!f)return;onChange(URL.createObjectURL(f));}}/>
      <button className="px-3 py-2 bg-black text-white rounded-lg" onClick={()=>ref.current?.click()}>Upload Image</button>
      {value&&<button className="px-3 py-2 bg-gray-200 rounded-lg" onClick={()=>onChange('')}>Remove</button>}
    </div>
  </div>;
}

function Config({sel,setSel,go}){
  const p=useMemo(()=>calc(sel),[sel]);
  return <div className="grid lg:grid-cols-3 gap-6">
    <div className="lg:col-span-2 space-y-4">
      <section className="bg-white p-4 rounded-xl shadow-sm">
        <h3 className="font-semibold mb-2">Choose Service</h3>
        <div className="grid sm:grid-cols-3 gap-2">{SERVICES.map(s=>
          <button key={s.id} className={`border rounded-lg p-3 text-left ${sel.serviceId===s.id?'border-black bg-gray-50':'border-gray-200'}`} onClick={()=>setSel(v=>({...v,serviceId:s.id}))}>
            <div className="font-medium">{s.name}</div>
          </button>)}
        </div>
      </section>
      <section className="bg-white p-4 rounded-xl shadow-sm">
        <h3 className="font-semibold mb-2">Configure</h3>
        <div className="grid sm:grid-cols-2 gap-3">
          <div><label className="text-sm text-gray-600">Material</label>
            <select className="w-full border rounded-lg p-2 mt-1" value={sel.materialId} onChange={e=>setSel(v=>({...v,materialId:e.target.value}))}>{MATERIALS.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select></div>
          <div><label className="text-sm text-gray-600">Finish</label>
            <select className="w-full border rounded-lg p-2 mt-1" value={sel.finishId} onChange={e=>setSel(v=>({...v,finishId:e.target.value}))}>{FINISHES.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}</select></div>
          <div><label className="text-sm text-gray-600">Size</label>
            <select className="w-full border rounded-lg p-2 mt-1" value={sel.sizeId} onChange={e=>setSel(v=>({...v,sizeId:e.target.value}))}>{SIZES.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
          <div><label className="text-sm text-gray-600">Color</label>
            <input type="color" className="w-full border rounded-lg p-1 mt-1 h-10" value={sel.color} onChange={e=>setSel(v=>({...v,color:e.target.value}))}/></div>
          <div><label className="text-sm text-gray-600">Quantity</label>
            <input type="number" min="1" className="w-full border rounded-lg p-2 mt-1" value={sel.qty} onChange={e=>setSel(v=>({...v,qty:Math.max(1,+e.target.value||1)}))}/>
            <p className="text-xs text-gray-500 mt-1">Discounts at 10/20/50/100.</p></div>
          <div><label className="text-sm text-gray-600">Add-ons</label>
            <div className="mt-2 space-y-1">{ADDONS.map(a=>{
              const checked=sel.addons.includes(a.id);
              return <label key={a.id} className="flex items-center gap-2"><input type="checkbox" checked={checked} onChange={e=>setSel(v=>({...v,addons:e.target.checked?[...v.addons,a.id]:v.addons.filter(x=>x!==a.id)}))}/><span className="text-sm">{a.name} ({currency(a.price)})</span></label>
            })}</div></div>
        </div>
      </section>
      <section className="bg-white p-4 rounded-xl shadow-sm">
        <h3 className="font-semibold mb-2">Upload & Notes</h3>
        <div className="grid sm:grid-cols-2 gap-4">
          <Upload value={sel.imageUrl} onChange={url=>setSel(v=>({...v,imageUrl:url}))}/>
          <div><label className="text-sm text-gray-600">Notes</label>
            <textarea className="w-full border rounded-lg p-3 mt-1 min-h-32" value={sel.notes} onChange={e=>setSel(v=>({...v,notes:e.target.value}))} placeholder="Placement, site details, install needs, etc."/>
          </div>
        </div>
      </section>
    </div>
    <aside className="space-y-3">
      <div className="bg-white p-4 rounded-xl shadow-sm">
        <h4 className="font-semibold mb-2">Live Quote</h4>
        <ul className="text-sm text-gray-700 space-y-1">
          <li>Per unit: <b>{currency(calc(sel).per)}</b></li>
          <li>Qty: <b>{sel.qty}</b> {calc(sel).disc? <span className="text-emerald-600">(-{Math.round(calc(sel).disc*100)}%)</span>:null}</li>
          <li>Add-ons: <b>{currency(calc(sel).addons)}</b></li>
          <li>Subtotal: <b>{currency(calc(sel).subtotal)}</b></li>
          <li>Tax (16%): <b>{currency(calc(sel).tax)}</b></li>
          <li className="text-lg">Total: <b>{currency(calc(sel).total)}</b></li>
        </ul>
        <button className="mt-3 w-full bg-black text-white py-2 rounded-lg" onClick={go}>Checkout →</button>
      </div>
      <div className="bg-white p-4 rounded-xl shadow-sm">
        <h4 className="font-semibold mb-2">Preview</h4>
        <div className="h-48 border rounded-xl flex items-center justify-center" style={{background:sel.color}}>
          {sel.imageUrl? <img src={sel.imageUrl} className="max-h-40 max-w-full mix-blend-multiply"/>:<span className="text-white font-semibold">Your Design Here</span>}
        </div>
      </div>
    </aside>
  </div>;
}

function Checkout({sel,back,place}){
  const [c,setC]=useState({name:'',email:'',phone:'',address:''});
  const p=useMemo(()=>calc(sel),[sel]);
  const ok=c.name&&c.email;
  return <div className="grid lg:grid-cols-3 gap-6">
    <div className="lg:col-span-2 bg-white p-4 rounded-xl shadow-sm">
      <h3 className="font-semibold mb-3">Checkout</h3>
      <div className="grid sm:grid-cols-2 gap-3">
        <div><label className="text-sm text-gray-600">Full Name</label><input className="w-full border rounded-lg p-2 mt-1" value={c.name} onChange={e=>setC({...c,name:e.target.value})}/></div>
        <div><label className="text-sm text-gray-600">Email</label><input className="w-full border rounded-lg p-2 mt-1" value={c.email} onChange={e=>setC({...c,email:e.target.value})}/></div>
        <div><label className="text-sm text-gray-600">Phone</label><input className="w-full border rounded-lg p-2 mt-1" value={c.phone} onChange={e=>setC({...c,phone:e.target.value})}/></div>
        <div className="sm:col-span-2"><label className="text-sm text-gray-600">Address</label><textarea className="w-full border rounded-lg p-3 mt-1" value={c.address} onChange={e=>setC({...c,address:e.target.value})}/></div>
      </div>
      <div className="mt-3 flex gap-2"><button className="px-3 py-2 bg-gray-100 rounded-lg" onClick={back}>Back</button>
        <button className={`px-3 py-2 rounded-lg text-white ${ok?'bg-black':'bg-gray-400'}`} disabled={!ok} onClick={()=>place(c,p)}>Place Order</button></div>
    </div>
    <aside className="bg-white p-4 rounded-xl shadow-sm">
      <h4 className="font-semibold mb-2">Order Summary</h4>
      <div className="text-sm space-y-1">
        <div>Service: <b>{SERVICES.find(s=>s.id===sel.serviceId)?.name}</b></div>
        <div>Material: <b>{MATERIALS.find(m=>m.id===sel.materialId)?.name}</b></div>
        <div>Finish: <b>{FINISHES.find(f=>f.id===sel.finishId)?.name}</b></div>
        <div>Size: <b>{SIZES.find(s=>s.id===sel.sizeId)?.name}</b></div>
        <div>Qty: <b>{sel.qty}</b></div>
      </div>
      <div className="border rounded-xl p-3 mt-3">
        <div>Subtotal: <b>{currency(p.subtotal)}</b></div>
        <div>Tax: <b>{currency(p.tax)}</b></div>
        <div className="text-lg">Total: <b>{currency(p.total)}</b></div>
      </div>
      <div className="mt-3 border rounded-xl h-40 flex items-center justify-center" style={{background:sel.color}}>
        {sel.imageUrl?<img src={sel.imageUrl} className="max-h-36 max-w-full mix-blend-multiply"/>:<span className="text-white font-semibold">Preview</span>}
      </div>
    </aside>
  </div>;
}

function Dashboard({orders,setOrders}){
  const [q,setQ]=useState('');
  const list=useMemo(()=>orders.filter(o=>(o.customer.name+o.customer.email+o.service).toLowerCase().includes(q.toLowerCase())),[orders,q]);
  const advance=id=>setOrders(prev=>{const next=prev.map(o=>o.id===id?{...o,status:FLOW[Math.min(FLOW.indexOf(o.status)+1,FLOW.length-1)]}:o);localStorage.setItem('protosign_orders',JSON.stringify(next));return next;});
  const cancel=id=>setOrders(prev=>{const next=prev.map(o=>o.id===id?{...o,status:'Cancelled'}:o);localStorage.setItem('protosign_orders',JSON.stringify(next));return next;});
  return <div className="bg-white p-4 rounded-xl shadow-sm">
    <div className="flex justify-between items-center gap-3 flex-wrap">
      <h3 className="font-semibold">Customer Portal & Orders</h3>
      <input className="border rounded-lg p-2 min-w-[240px]" placeholder="Search orders" value={q} onChange={e=>setQ(e.target.value)}/>
    </div>
    <div className="mt-3 overflow-x-auto">
      <table className="w-full text-sm">
        <thead><tr className="text-left text-gray-600"><th className="py-2">Order #</th><th>Customer</th><th>Service</th><th>Total</th><th>Status</th><th>ETA</th><th>Actions</th></tr></thead>
        <tbody>
        {list.map(o=>(<tr key={o.id} className="border-t">
          <td className="py-2 font-medium">{o.id}</td>
          <td>{o.customer.name}<div className="text-xs text-gray-500">{o.customer.email}</div></td>
          <td>{o.service}</td><td>{currency(o.total)}</td>
          <td><span className="px-2 py-1 rounded-full bg-gray-100">{o.status}</span></td>
          <td>{o.eta}</td>
          <td className="space-x-2"><button className="px-2 py-1 rounded bg-black text-white" onClick={()=>advance(o.id)}>Advance</button>
            <button className="px-2 py-1 rounded bg-gray-200" onClick={()=>cancel(o.id)}>Cancel</button></td>
        </tr>))}
        {list.length===0&&(<tr><td colSpan="7" className="py-6 text-center text-gray-500">No orders yet.</td></tr>)}
        </tbody>
      </table>
    </div>
  </div>;
}

function App(){
  const [tab,setTab]=useState('home');
  const [orders,setOrders]=useState(()=>{try{return JSON.parse(localStorage.getItem('protosign_orders')||'[]')}catch{return[]}});
  const [sel,setSel]=useState({serviceId:'branding',materialId:'acrylic',finishId:'matte',sizeId:'m',color:'#2E86AB',qty:5,addons:[],imageUrl:'',notes:''});
  useEffect(()=>{if(orders.length===0){const demo={id:uid(),customer:{name:'Demo Client',email:'demo@client.com'},service:'3D Branding',total:1299,status:'Quality Check',eta:new Date(Date.now()+4*86400000).toLocaleDateString()};const seeded=[demo];setOrders(seeded);localStorage.setItem('protosign_orders',JSON.stringify(seeded));}},[]);
  const go=()=>setTab('checkout');
  const place=(customer,price)=>{const id=uid();const eta=new Date(Date.now()+7*86400000).toLocaleDateString();const order={id,customer,service:SERVICES.find(s=>s.id===sel.serviceId)?.name,total:price.total,status:FLOW[0],eta,createdAt:new Date().toISOString()};const next=[order,...orders];setOrders(next);localStorage.setItem('protosign_orders',JSON.stringify(next));setTab('dashboard');};
  return <div className="min-h-screen bg-gradient-to-b from-gray-50 to-gray-100">
    <header className="sticky top-0 bg-white/80 border-b backdrop-blur z-10">
      <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
        <div className="font-extrabold text-xl">Protosign <span className="text-gray-500">MVP</span></div>
        <nav className="flex gap-2">{[{id:'home',label:'Home'},{id:'configure',label:'Configurator'},{id:'checkout',label:'Checkout'},{id:'dashboard',label:'Customer Portal'}].map(t=>
          <button key={t.id} onClick={()=>setTab(t.id)} className={`px-3 py-1.5 rounded ${tab===t.id?'bg-black text-white':'hover:bg-gray-100'}`}>{t.label}</button>)}</nav>
      </div>
    </header>
    <main className="max-w-6xl mx-auto px-4 py-6 space-y-6">
      {tab==='home'&&(<div className="grid lg:grid-cols-2 gap-6 items-center">
        <div className="space-y-3">
          <h1 className="text-3xl font-black">Smart 3D Branding, Signage & Furniture — Online.</h1>
          <p className="text-gray-600 text-sm">Configure, preview, get instant pricing, and track orders.</p>
          <div className="flex gap-2"><button onClick={()=>setTab('configure')} className="px-4 py-3 rounded bg-black text-white">Start an Order</button>
            <button onClick={()=>setTab('dashboard')} className="px-4 py-3 rounded bg-white border">View Customer Portal</button></div>
        </div>
        <div className="bg-white rounded-xl p-5 shadow-sm"><div className="grid sm:grid-cols-3 gap-3">{SERVICES.map(s=>
          <div key={s.id} className="border rounded-xl p-4"><div className="font-semibold">{s.name}</div>
            <button className="mt-3 w-full bg-black text-white py-2 rounded" onClick={()=>{setSel(v=>({...v,serviceId:s.id}));setTab('configure')}}>Configure</button>
          </div>)}</div></div>
      </div>)}
      {tab==='configure'&&<Config sel={sel} setSel={setSel} go={go}/>}
      {tab==='checkout'&&<Checkout sel={sel} back={()=>setTab('configure')} place={place}/>}
      {tab==='dashboard'&&<Dashboard orders={orders} setOrders={setOrders}/>}
    </main>
    <footer className="max-w-6xl mx-auto px-4 py-8 text-xs text-gray-500 flex justify-between">
      <span>© 2025 Protosign — Prototype</span><span>Inventory/QC/Data hooks ready</span>
    </footer>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
